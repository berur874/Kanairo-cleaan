openapi: 3.0.0
info:
  title: Kanairo-Klean Provider API
  description: API contract provided by Kanairo-Klean (Team 13) for Group 1 (Artisans App) to source raw materials and log scrap.
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /collection-locations:
    get:
      summary: List collection and drop-off hotspots
      description: Retrieve collection locations where artisans can pick up materials. Only active locations are returned, so is_active is always true in this list. Inactive locations never appear here, and drop-offs to them return 404.
      responses:
        '200':
          description: A list of active collection hotspots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionLocation'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /materials:
    get:
      summary: Read raw materials catalog
      description: Retrieve available raw materials with costs, with optional filtering by material type and minimum available quantity.
      parameters:
        - name: type
          in: query
          required: false
          description: Filter by material type. Must be one of the MaterialType values; any other value returns 400.
          schema:
            $ref: '#/components/schemas/MaterialType'
        - name: min_quantity_kg
          in: query
          required: false
          description: Filter materials available in quantities greater than or equal to this value (in kg). Must be a number >= 0; anything else returns 400.
          schema:
            type: number
            format: float
            minimum: 0
            example: 50.0
      responses:
        '200':
          description: A catalog of raw materials matching search criteria.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
        '400':
          description: Invalid filter, e.g. an unknown type or a negative or non-numeric min_quantity_kg.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: 'type must be one of: metal, plastic, paper, glass, e-waste'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /scrap-logs:
    post:
      summary: Create leftover scrap log entry
      description: Submit a log entry reporting reusable leftover scrap material after a job is completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapLogInput'
      responses:
        '201':
          description: Scrap log entry successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapLog'
        '400':
          description: Invalid request payload or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Send the API token issued by Kanairo-Klean as "Authorization: Bearer <token>".'
  responses:
    Unauthorized:
      description: Missing or invalid API token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Missing or invalid API token
  schemas:
    MaterialType:
      type: string
      description: The fixed list of material types. Used by Material.type, the GET /materials type filter, and drop-off material_type.
      enum: [metal, plastic, paper, glass, e-waste]
      example: metal

    CollectionLocation:
      type: object
      required:
        - location_id
        - name
        - area
        - county
        - is_active
      properties:
        location_id:
          type: string
          example: "1"
        name:
          type: string
          example: "Gikomba"
        area:
          type: string
          example: "Kamukunji"
        county:
          type: string
          description: Kenyan county the location is in. Most locations are in Nairobi; some (e.g. Ruiru) are in neighbouring counties.
          example: "Nairobi"
        is_active:
          type: boolean
          example: true

    Material:
      type: object
      required:
        - material_id
        - name
        - type
        - quantity_kg
        - unit_price_kes
      properties:
        material_id:
          type: string
          example: "mat-554"
        name:
          type: string
          example: "Aluminum Scrap Headers"
        type:
          $ref: '#/components/schemas/MaterialType'
        quantity_kg:
          type: number
          format: float
          example: 120.5
        unit_price_kes:
          type: number
          format: float
          description: Price in KES per kg.
          example: 150.00

    ScrapLogInput:
      type: object
      required:
        - job_id
        - artisan_id
        - material_type
        - quantity_kg
      properties:
        job_id:
          type: string
          example: "job-8812"
        artisan_id:
          type: string
          example: "art-302"
        material_type:
          type: string
          example: "metal"
        quantity_kg:
          type: number
          format: float
          example: 12.5
        notes:
          type: string
          example: "Offcut copper wiring and brass fittings."

    ScrapLog:
      type: object
      required:
        - log_id
        - job_id
        - artisan_id
        - material_type
        - quantity_kg
        - logged_at
      properties:
        log_id:
          type: string
          example: "log-9901"
        job_id:
          type: string
          example: "job-8812"
        artisan_id:
          type: string
          example: "art-302"
        material_type:
          type: string
          example: "metal"
        quantity_kg:
          type: number
          format: float
          example: 12.5
        notes:
          type: string
          example: "Offcut copper wiring and brass fittings."
        logged_at:
          type: string
          format: date-time
          example: "2026-09-07T10:30:00Z"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "Invalid material_type provided."