openapi: 3.0.0
info:
  title: Kanairo-Klean Provider API
  description: API contract provided by Kanairo-Klean (Team 13) for Group 1 (Artisans App) to source raw materials and log scrap.
  version: 1.0.0
paths:
  /collection-locations:
    get:
      summary: List collection and drop-off hotspots
      description: Retrieve active second-hand/raw material collection locations where artisans can pick up materials.
      responses:
        '200':
          description: A list of active collection hotspots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionLocation'

  /materials:
    get:
      summary: Read raw materials catalog
      description: Retrieve available raw materials with costs, with optional filtering by material type and minimum available quantity.
      parameters:
        - name: type
          in: query
          required: false
          description: Filter by material category (e.g., scrap_metal, plastic, wood).
          schema:
            type: string
            example: "scrap_metal"
        - name: min_quantity_kg
          in: query
          required: false
          description: Filter materials available in quantities greater than or equal to this value (in kg).
          schema:
            type: number
            format: float
            example: 50.0
      responses:
        '200':
          description: A catalog of raw materials matching search criteria.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'

  /scrap-logs:
    post:
      summary: Create leftover scrap log entry
      description: Submit a log entry reporting reusable leftover scrap material after a job is completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapLogInput'
      responses:
        '201':
          description: Scrap log entry successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapLog'
        '400':
          description: Invalid request payload or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    CollectionLocation:
      type: object
      required:
        - location_id
        - name
        - area
        - is_active
      properties:
        location_id:
          type: string
          example: "loc-001"
        name:
          type: string
          example: "Gikomba Sorting Depot"
        area:
          type: string
          example: "Kamukunji"
        is_active:
          type: boolean
          example: true

    Material:
      type: object
      required:
        - material_id
        - name
        - type
        - quantity_kg
        - unit_price_kes
      properties:
        material_id:
          type: string
          example: "mat-554"
        name:
          type: string
          example: "Aluminum Scrap Headers"
        type:
          type: string
          example: "scrap_metal"
        quantity_kg:
          type: number
          format: float
          example: 120.5
        unit_price_kes:
          type: number
          format: float
          example: 150.00

    ScrapLogInput:
      type: object
      required:
        - job_id
        - artisan_id
        - material_type
        - quantity_kg
      properties:
        job_id:
          type: string
          example: "job-8812"
        artisan_id:
          type: string
          example: "art-302"
        material_type:
          type: string
          example: "scrap_metal"
        quantity_kg:
          type: number
          format: float
          example: 12.5
        notes:
          type: string
          example: "Offcut copper wiring and brass fittings."

    ScrapLog:
      type: object
      required:
        - log_id
        - job_id
        - artisan_id
        - material_type
        - quantity_kg
        - logged_at
      properties:
        log_id:
          type: string
          example: "log-9901"
        job_id:
          type: string
          example: "job-8812"
        artisan_id:
          type: string
          example: "art-302"
        material_type:
          type: string
          example: "scrap_metal"
        quantity_kg:
          type: number
          format: float
          example: 12.5
        notes:
          type: string
          example: "Offcut copper wiring and brass fittings."
        logged_at:
          type: string
          format: date-time
          example: "2026-09-07T10:30:00Z"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "Invalid material_type provided."