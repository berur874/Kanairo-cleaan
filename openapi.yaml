openapi: 3.0.0
info:
  title: Kanairo-Klean Marketplace API
  version: 1.0.0
  description: API contract for Kanairo-Klean venue management and raw material sourcing.

paths:
  /venues:
    get:
      summary: List market venues filtered by category and Nairobi area
      parameters:
        - name: category
          in: query
          required: false
          description: Filter venues by category type (e.g., recycling, market)
          schema:
            type: string
            example: recycling
        - name: area
          in: query
          required: false
          description: Filter venues by Nairobi area/neighborhood
          schema:
            type: string
            example: Westlands
      responses:
        '200':
          description: A list of filtered market venues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Venue'
        '400':
          $ref: '#/components/responses/400Error'

  /venues/{venue_id}:
    get:
      summary: Retrieve specific venue details including address, geolocation, and accessibility badges
      parameters:
        - name: venue_id
          in: path
          required: true
          description: Unique identifier of the venue
          schema:
            type: string
            example: ven_12345
      responses:
        '200':
          description: Detailed information about the specified venue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueDetail'
        '404':
          $ref: '#/components/responses/404Error'

  /venues/{venue_id}/rating:
    get:
      summary: Read the average community star rating for a venue
      parameters:
        - name: venue_id
          in: path
          required: true
          description: Unique identifier of the venue
          schema:
            type: string
            example: ven_12345
      responses:
        '200':
          description: The community rating summary for the venue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueRating'
        '404':
          $ref: '#/components/responses/404Error'

  /collection-locations:
    get:
      summary: Read active collection and drop-off hotspot locations
      responses:
        '200':
          description: A list of active material sourcing hotspot locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionLocation'

  /materials:
    get:
      summary: Read raw materials catalog with optional filters for type and minimum quantity
      parameters:
        - name: type
          in: query
          required: false
          description: Filter by raw material type (e.g., plastic, glass, metal)
          schema:
            type: string
            example: PET Plastic
        - name: min_quantity_kg
          in: query
          required: false
          description: Filter by the minimum quantity of material (in kg) available
          schema:
            type: number
            format: float
            example: 50.5
      responses:
        '200':
          description: Catalog list of raw materials matching search criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
        '400':
          $ref: '#/components/responses/400Error'

  /scrap-logs:
    post:
      summary: Create a leftover-scrap log entry after a completed job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapLogCreate'
      responses:
        '201':
          description: Scrap log entry successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapLog'
        '400':
          $ref: '#/components/responses/400Error'

components:
  responses:
    '400Error':
      description: Invalid request parameters or body payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '404Error':
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Venue:
      type: object
      required:
        - id
        - name
        - category
        - area
      properties:
        id:
          type: string
          example: ven_12345
        name:
          type: string
          example: Kariobangi Social Market
        category:
          type: string
          example: Recycling Center
        area:
          type: string
          example: Eastlands

    VenueDetail:
      type: object
      required:
        - id
        - name
        - category
        - area
        - full_address
        - latitude
        - longitude
        - accessibility_badges
      properties:
        id:
          type: string
          example: ven_12345
        name:
          type: string
          example: Kariobangi Social Market
        category:
          type: string
          example: Recycling Center
        area:
          type: string
          example: Eastlands
        full_address:
          type: string
          example: Kamunde Road, Kariobangi North, Nairobi
        latitude:
          type: number
          format: double
          example: -1.2523
        longitude:
          type: number
          format: double
          example: 36.8831
        accessibility_badges:
          type: array
          description: Embedded static accessibility features available at venue
          items:
            type: string
          example: ["wheelchair_accessible_entrance", "step_free_access", "spacious_loading_bay"]

    VenueRating:
      type: object
      required:
        - venue_id
        - average_rating
        - total_reviews
      properties:
        venue_id:
          type: string
          example: ven_12345
        average_rating:
          type: number
          format: float
          example: 4.6
        total_reviews:
          type: integer
          example: 128

    CollectionLocation:
      type: object
      required:
        - id
        - name
        - location_type
        - latitude
        - longitude
        - is_active
      properties:
        id:
          type: string
          example: loc_88321
        name:
          type: string
          example: Gikomba Collection Hotspot
        location_type:
          type: string
          enum: [collection_point, drop_off_spot, hub]
          example: drop_off_spot
        latitude:
          type: number
          format: double
          example: -1.2841
        longitude:
          type: number
          format: double
          example: 36.8362
        is_active:
          type: boolean
          example: true

    Material:
      type: object
      required:
        - id
        - name
        - type
        - quantity_available_kg
        - unit_price_kes
      properties:
        id:
          type: string
          example: mat_99410
        name:
          type: string
          example: Sorted HDPE Plastic Flakes
        type:
          type: string
          example: HDPE Plastic
        quantity_available_kg:
          type: number
          format: float
          example: 250.0
        unit_price_kes:
          type: number
          format: float
          example: 45.00

    ScrapLogCreate:
      type: object
      required:
        - job_id
        - material_type
        - quantity_kg
        - reported_at
      properties:
        job_id:
          type: string
          example: job_77210
        material_type:
          type: string
          example: Scrap Copper Wire
        quantity_kg:
          type: number
          format: float
          example: 12.5
        notes:
          type: string
          example: Leftover wiring insulation stripped and ready for recycling.
        reported_at:
          type: string
          format: date-time
          example: "2026-09-07T13:00:00Z"

    ScrapLog:
      type: object
      required:
        - id
        - job_id
        - material_type
        - quantity_kg
        - reported_at
        - status
      properties:
        id:
          type: string
          example: log_44129
        job_id:
          type: string
          example: job_77210
        material_type:
          type: string
          example: Scrap Copper Wire
        quantity_kg:
          type: number
          format: float
          example: 12.5
        notes:
          type: string
          example: Leftover wiring insulation stripped and ready for recycling.
        reported_at:
          type: string
          format: date-time
          example: "2026-09-07T13:00:00Z"
        status:
          type: string
          enum: [logged, verified, processed]
          example: logged

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "Invalid query parameter or missing required body attribute."