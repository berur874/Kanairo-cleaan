openapi: 3.0.0
info:
  title: Kanairo-Klean Provider API
  description: API contract provided by Kanairo-Klean (Team 13) for Group 1 (Artisans App) to source raw materials and log scrap.
  version: 1.2.0
servers:
  - url: http://localhost:5050
    description: Local development (see README for setup)
  - url: https://supervoluminous-vikki-unsurlily.ngrok-free.dev
    description: Hosted for partner testing. Only up while the Kanairo-Klean team is running it.
# Every operation needs one partner API key, sent either way below (the two entries mean "one or the other").
security:
  - bearerAuth: []
  - apiKeyAuth: []
paths:
  /collection-locations:
    get:
      summary: List collection and drop-off hotspots
      description: Retrieve collection locations where artisans can pick up materials. Only active locations are returned, so is_active is always true in this list. Inactive locations never appear here, and drop-offs to them return 404.
      responses:
        '200':
          description: A list of active collection hotspots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionLocation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /materials:
    get:
      summary: Read raw materials catalog
      description: Retrieve available raw materials with costs, with optional filtering by material type and minimum available quantity.
      parameters:
        - name: type
          in: query
          required: false
          description: Filter by material type. Must be one of the MaterialType values; any other value returns 400.
          schema:
            $ref: '#/components/schemas/MaterialType'
        - name: min_quantity_kg
          in: query
          required: false
          description: Filter materials available in quantities greater than or equal to this value (in kg). Must be a number >= 0; anything else returns 400.
          schema:
            type: number
            format: float
            minimum: 0
            example: 50.0
      responses:
        '200':
          description: A catalog of raw materials matching search criteria.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
        '400':
          description: Invalid filter, e.g. an unknown type or a negative or non-numeric min_quantity_kg.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: 'type must be one of: metal, plastic, paper, glass, e-waste'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /collection-locations/{location_id}/drop-offs:
    post:
      summary: Report leftover scrap dropped off at a collection location
      description: Record reusable leftover scrap brought to one of our active collection locations. New drop-offs start as pending. Replaces POST /scrap-logs.
      parameters:
        - name: location_id
          in: path
          required: true
          description: A location_id from GET /collection-locations.
          schema:
            type: string
            example: "1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DropOffInput'
      responses:
        '201':
          description: Drop-off recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DropOff'
        '400':
          description: Missing or invalid field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: material_type, quantity_kg and source are required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '404':
          description: No active collection location has this location_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: Collection location 99 not found

  /scrap-logs:
    post:
      deprecated: true
      summary: Create leftover scrap log entry (deprecated)
      description: Deprecated in 1.1.0; use POST /collection-locations/{location_id}/drop-offs instead. Still accepted until consumers have moved over.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapLogInput'
      responses:
        '201':
          description: Scrap log entry successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapLog'
        '400':
          description: Invalid request payload or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Send the API key issued to you by Kanairo-Klean as "Authorization: Bearer <your-api-key>". Each consumer has its own key.'
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: The same key can be sent in the X-API-Key header instead of Authorization.
  responses:
    Unauthorized:
      description: Missing or invalid API key (no key, a wrong key, or a revoked key).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Missing or invalid API token
    TooManyRequests:
      description: >-
        Rate limit reached: 100 requests per minute per API key, and 300 per minute per IP address.
        Wait the number of seconds in Retry-After, then try again.
      headers:
        Retry-After:
          description: Seconds until the limit resets.
          schema:
            type: integer
            example: 42
        X-RateLimit-Limit:
          description: Requests allowed in the current window.
          schema:
            type: integer
            example: 100
        X-RateLimit-Remaining:
          description: Requests left in the current window.
          schema:
            type: integer
            example: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
          example:
            code: 429
            message: Too many requests
            retryAfter: 42
    ServerError:
      description: Something failed on our side. The body never contains database or stack details; quote ref when reporting it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerError'
          example:
            code: 500
            message: Something went wrong on our side
            ref: 3f9a1c2e
  schemas:
    MaterialType:
      type: string
      description: The fixed list of material types. Used by Material.type, the GET /materials type filter, and drop-off material_type.
      enum: [metal, plastic, paper, glass, e-waste]
      example: metal

    CollectionLocation:
      type: object
      required:
        - location_id
        - name
        - area
        - county
        - is_active
      properties:
        location_id:
          type: string
          example: "1"
        name:
          type: string
          example: "Gikomba"
        area:
          type: string
          example: "Kamukunji"
        county:
          type: string
          description: Kenyan county the location is in. Most locations are in Nairobi; some (e.g. Ruiru) are in neighbouring counties.
          example: "Nairobi"
        is_active:
          type: boolean
          example: true

    Material:
      type: object
      required:
        - material_id
        - name
        - type
        - quantity_kg
        - unit_price_kes
      properties:
        material_id:
          type: string
          example: "mat-554"
        name:
          type: string
          example: "Aluminum Scrap Headers"
        type:
          $ref: '#/components/schemas/MaterialType'
        quantity_kg:
          type: number
          format: float
          example: 120.5
        unit_price_kes:
          type: number
          format: float
          description: Price in KES per kg.
          example: 150.00

    DropOffInput:
      type: object
      required:
        - material_type
        - quantity_kg
        - source
      properties:
        material_type:
          $ref: '#/components/schemas/MaterialType'
        quantity_kg:
          type: number
          format: float
          exclusiveMinimum: true
          minimum: 0
          example: 12.5
        source:
          type: string
          minLength: 1
          maxLength: 120
          description: Free text saying who is dropping off the scrap. Not validated against any id.
          example: "Find My Artisan, electrical job in Embakasi"
        notes:
          type: string
          minLength: 1
          example: "Offcut copper wiring and brass fittings."

    DropOff:
      type: object
      required:
        - drop_off_id
        - location_id
        - material_type
        - quantity_kg
        - source
        - status
        - created_at
      properties:
        drop_off_id:
          type: string
          example: "drop-0001"
        location_id:
          type: string
          example: "1"
        material_type:
          $ref: '#/components/schemas/MaterialType'
        quantity_kg:
          type: number
          format: float
          example: 12.5
        source:
          type: string
          example: "Find My Artisan, electrical job in Embakasi"
        notes:
          type: string
          description: Present only when notes were sent.
          example: "Offcut copper wiring and brass fittings."
        status:
          type: string
          enum: [pending, received]
          description: New drop-offs are pending until Kanairo-Klean staff receive them.
          example: pending
        created_at:
          type: string
          format: date-time
          example: "2026-10-16T10:30:00Z"

    ScrapLogInput:
      type: object
      required:
        - job_id
        - artisan_id
        - material_type
        - quantity_kg
      properties:
        job_id:
          type: string
          example: "job-8812"
        artisan_id:
          type: string
          example: "art-302"
        material_type:
          type: string
          example: "metal"
        quantity_kg:
          type: number
          format: float
          example: 12.5
        notes:
          type: string
          example: "Offcut copper wiring and brass fittings."

    ScrapLog:
      type: object
      required:
        - log_id
        - job_id
        - artisan_id
        - material_type
        - quantity_kg
        - logged_at
      properties:
        log_id:
          type: string
          example: "log-9901"
        job_id:
          type: string
          example: "job-8812"
        artisan_id:
          type: string
          example: "art-302"
        material_type:
          type: string
          example: "metal"
        quantity_kg:
          type: number
          format: float
          example: 12.5
        notes:
          type: string
          example: "Offcut copper wiring and brass fittings."
        logged_at:
          type: string
          format: date-time
          example: "2026-09-07T10:30:00Z"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "Invalid material_type provided."

    RateLimitError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required:
            - retryAfter
          properties:
            retryAfter:
              type: integer
              description: Seconds until you can try again (same as the Retry-After header).
              example: 42

    ServerError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            ref:
              type: string
              description: Reference to quote when reporting the error; it matches an entry in our server log.
              example: 3f9a1c2e
